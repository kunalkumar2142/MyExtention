<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyExtention</title>
    <link rel="stylesheet" href="bulma.min.css">
</head>
<body>

    <div class="container m-5">
        <h2 class="title">MyExteniton</h2>
         
        <div class="field">
            <label class="label">Status</label>
            <span class="tag is-success" >Running</span>
            <span class="tag is-danger ">Stopped</span>
        </div>
    </div>
    <div class="container m-3">

        <div class="feild">
            <label class="label">Loction ID</label>
            <div class="select">
                <select id="locationId">
                    <option value="select">select</option>
                    <option value="bihar">bihar</option>
                    <option value="up">up</option>
                </select>
            </div>
        </div>

        <div class="field">
            <label class="label" id="startDate">Start date</label>
            <div class="control">
                <input type="date" class="input">
            </div>
        </div>

        <div class="field">
            <label class="label" id="endDate">End date</label>
            <div class="control">
                <input type="date" class="input">
            </div>
        </div>

    </div>

    <div class="container m-3">
        <button class="button is-success is-fullwidth" id="startButton">Start</button>
    </div>

    <div class="container m-3">
        <button class="button is-danger is-fullwidth" id="stopButton">Stop</button> 
    </div>
    
</body>

<script src="popup.js"></script>

</html>
